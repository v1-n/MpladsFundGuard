services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: mplads_backend
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    volumes:
      - ./data:/app/data
    environment:
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-8000}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - AUDIT_AUTH_ENABLED=${AUDIT_AUTH_ENABLED:-true}
      - AUDIT_REVIEWER_TOKENS=${AUDIT_REVIEWER_TOKENS:-}

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: mplads_frontend
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:${PORT:-8000}
    depends_on:
      - backend
